<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMMS · Maintenance Management</title>
<style>
  :root{
    --navy:#0f2b46; --navy2:#16456e; --blue:#2e86c1; --teal:#17a589; --orange:#e67e22;
    --red:#c0392b; --green:#1e8449; --purple:#8e44ad; --grey:#7f8c8d;
    --line:#e2e8ef; --bg:#eef1f5; --card:#fff; --ink:#1f2a33; --muted:#6b7783;
    --a:#1e8449; --b:#e67e22; --c:#7f8c8d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--blue)}
  .topbar{background:var(--navy);color:#fff;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .brand .mk{width:32px;height:32px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.5px}
  .brand small{display:block;font-weight:400;color:#b9cee0;font-size:11px}
  .topbar .spacer{flex:1}
  .who{display:flex;align-items:center;gap:9px;font-size:13px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 14px;overflow-x:auto}
  .nav button{background:none;border:none;padding:13px 15px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
  .nav button.active{color:var(--navy);border-bottom-color:var(--navy)}
  .nav .cnt{background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:5px;font-weight:700}
  .wrap{padding:20px;max-width:1320px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:16px;color:var(--navy)}
  .card .desc{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .card h3{margin:16px 0 8px;font-size:14px;color:var(--navy)}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
  @media(max-width:560px){.g4{grid-template-columns:1fr}}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px}
  .kpi .v{font-size:26px;font-weight:700;color:var(--navy);line-height:1.1}
  .kpi .l{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-top:5px;text-transform:uppercase;font-weight:600}
  .kpi .s{font-size:11.5px;color:var(--muted);margin-top:3px}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 15px;cursor:pointer;font-weight:600}
  .btn:hover{background:var(--navy2)}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid #c7d9ea}
  .btn.ghost:hover{background:#f0f6fc}
  .btn.green{background:var(--teal)}.btn.green:hover{background:#128f76}
  .btn.red{background:var(--red)}.btn.red:hover{background:#a5311f}
  .btn.grey{background:var(--grey)}.btn.grey:hover{background:#6b7879}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .field label{font-size:12px;font-weight:600;color:var(--muted)}
  .field input,.field select,.field textarea{padding:9px 10px;border:1px solid #cfd8e2;border-radius:8px;background:#fff;width:100%}
  .field textarea{min-height:64px;resize:vertical}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--navy);color:#fff;text-align:left;padding:9px 9px;font-weight:600;white-space:nowrap}
  td{border-bottom:1px solid var(--line);padding:9px 9px;vertical-align:top}
  tr:nth-child(even) td{background:#fafcfe}
  .tw{width:100%;overflow-x:auto}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .b-grey{background:#e6eaee;color:#546e7a}
  .b-blue{background:#e3f0fa;color:#1c6ea4}
  .b-orange{background:#fdf0e2;color:#b06012}
  .b-red{background:#fdeaea;color:#a5311f}
  .b-green{background:#e0f7ea;color:#1E8449}
  .b-teal{background:#dcf5e6;color:#145A32}
  .b-purple{background:#f2e9f9;color:#6d33a3}
  .b-navy{background:#e3e9f0;color:#0f2b46}
  .muted{color:var(--muted)}.small{font-size:12px}
  .bar{height:18px;border-radius:5px;background:#e8edf3;overflow:hidden}
  .bar>i{display:block;height:100%}
  .modal-bg{position:fixed;inset:0;background:rgba(15,30,45,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:60}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:680px;padding:20px}
  .modal h2{margin:0 0 12px;color:var(--navy);font-size:18px}
  .toast{position:fixed;right:18px;bottom:18px;background:#12304a;color:#fff;padding:12px 16px;border-radius:9px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:340px}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
  .crit-A{border-left:5px solid var(--a)}
  .crit-B{border-left:5px solid var(--b)}
  .crit-C{border-left:5px solid var(--c)}
  .pill{display:inline-block;background:#eef3f8;border-radius:6px;padding:2px 8px;font-size:11.5px;margin:2px 4px 2px 0;color:#40515f}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  @media(max-width:760px){.wrap{padding:13px 11px}.card{padding:13px}input,select,textarea{font-size:16px}}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="nav" id="nav"></div>
<div id="app"></div>

<script>

/* ------------------------------- helpers -------------------------------- */
const $=id=>document.getElementById(id);
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dstr(off){const d=new Date();if(off)d.setDate(d.getDate()+off);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function today(){return dstr(0);}
function addFreq(dstrval,freq){
  const d=new Date(dstrval+'T00:00:00');
  if(freq==='Daily')d.setDate(d.getDate()+1);
  else if(freq==='Weekly')d.setDate(d.getDate()+7);
  else if(freq==='Monthly')d.setMonth(d.getMonth()+1);
  else if(freq==='Quarterly')d.setMonth(d.getMonth()+3);
  else if(freq==='Half-Yearly')d.setMonth(d.getMonth()+6);
  else if(freq==='Yearly')d.setFullYear(d.getFullYear()+1);
  const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function fmt(d){if(!d)return'—';const x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function money(n){return '৳'+Math.round(+n||0).toLocaleString();}
function asset(id){return DB.assets.find(a=>a.id===id)||{code:'—',name:'—',criticality:'C'};}
function tech(id){return DB.techs.find(t=>t.id===id)||{name:'Unassigned'};}
function badge(x,cls){return `<span class="badge ${cls}">${esc(x)}</span>`;}
function critBadge(c){return badge(c+'-Critical','b-'+(c==='A'?'red':c==='B'?'orange':'grey'));}
function toast(m){$('toast').innerHTML=`<div class="toast">${esc(m)}</div>`;setTimeout(()=>$('toast').innerHTML='',3200);}

function load(){try{const raw=localStorage.getItem(LS);DB=raw?JSON.parse(raw):seed();}catch(e){DB=seed();}
  ['assets','workOrders','pmPlans','parts','techs','breakdowns'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});
  if(!DB.seq)DB.seq=blankDB().seq;if(!DB.settings)DB.settings={plantHoursPerDay:24};}
function save(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}}
function resetDemo(){if(confirm('Reset all data back to the demo dataset?')){DB=seed();save();render();toast('Demo data restored.');}}

/* ------------------------------- KPIs ----------------------------------- */
function isOpen(w){return w.status!=='Completed'&&w.status!=='Closed';}
function isOverdue(w){return isOpen(w)&&w.dueDate&&w.dueDate<today();}
function periodDays(){return 90;}
function kpis(){
  const open=DB.workOrders.filter(isOpen).length;
  const overdue=DB.workOrders.filter(isOverdue).length;
  const down=DB.assets.filter(a=>a.status==='Down').length;
  const maint=DB.assets.filter(a=>a.status==='Under Maintenance').length;
  const totalDown=DB.breakdowns.reduce((s,b)=>s+(+b.mins||0),0);
  const fails=DB.breakdowns.length;
  const periodHrs=periodDays()*DB.settings.plantHoursPerDay;
  const mttr=fails? (DB.breakdowns.reduce((s,b)=>s+(+b.mins||0),0)/fails/60) : 0;
  const mtbf=fails? ((periodHrs - totalDown/60)/fails) : periodHrs;
  const avail=periodHrs? ((periodHrs-totalDown/60)/periodHrs*100):100;
  const pm=DB.workOrders.filter(w=>w.type==='Preventive');
  const pmDone=pm.filter(w=>w.status==='Completed'||w.status==='Closed');
  const pmCompliance=pm.length? Math.round(pmDone.length*100/pm.length):0;
  const cost=DB.workOrders.reduce((s,w)=>s+(+w.partsCost||0)+(+w.laborCost||0),0);
  return {open:open,overdue:overdue,down:down,maint:maint,mttr:mttr,mtbf:mtbf,avail:avail,pmCompliance:pmCompliance,cost:cost,assets:DB.assets.length,techs:DB.techs.length};
}

function donut(pct,color,caption){
  pct=Math.max(0,Math.min(100,pct));
  return `<svg width="140" height="140" viewBox="0 0 42 42" style="display:block;margin:0 auto">
    <circle cx="21" cy="21" r="15.9" fill="none" stroke="#e8edf3" stroke-width="6"></circle>
    <circle cx="21" cy="21" r="15.9" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="25"></circle>
    <text x="21" y="20" text-anchor="middle" dominant-baseline="middle" font-size="8.5" font-weight="700" fill="#0f2b46">${pct}%</text>
    <text x="21" y="26.5" text-anchor="middle" font-size="3.2" fill="#6b7783">${esc(caption||'')}</text>
  </svg>`;
}
function barChart(rows){ // rows:[{label,value,color}]
  if(!rows.length)return '<div class="empty">No data.</div>';
  const max=Math.max.apply(null,rows.map(r=>r.value))||1;
  return rows.map(r=>`<div style="margin-bottom:10px">
    <div class="small" style="display:flex;justify-content:space-between"><span>${esc(r.label)}</span><b>${r.value.toLocaleString()}</b></div>
    <div class="bar"><i style="width:${Math.round(r.value*100/max)}%;background:${r.color||'#2E86C1'}"></i></div>
  </div>`).join('');
}

    <div class="row" style="justify-content:space-between"><div><h2>Preventive Maintenance Schedule</h2>
      <p class="desc">Recurring maintenance plans. Generating a work order advances the next due date automatically.</p></div>
      <div><button class="btn green" onclick="generateAllDue()">Generate all due</button> <button class="btn" onclick="openPMForm('')">+ New Plan</button></div></div>
    <table><thead><tr><th>Code</th><th>Asset</th><th>Plan</th><th>Frequency</th><th>Last Done</th><th>Next Due</th><th>Technician</th><th>State</th><th>Actions</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="9" class="empty">No PM plans.</td></tr>'}</tbody></table></div>`;
}
function openPMForm(id){
  const p=id?DB.pmPlans.find(x=>x.id===id):{code:'PM-'+String(DB.seq.pm).padStart(3,'0'),assetId:DB.assets[0]?DB.assets[0].id:'',title:'',frequency:'Monthly',lastDone:today(),nextDue:addFreq(today(),'Monthly'),estHours:4,assigneeId:'',active:true,tasks:''};
  modal(`<h2>${id?'Edit':'New'} PM Plan</h2>
    <div class="row"><div class="field" style="flex:0 0 130px"><label>Code</label><input id="f_code" value="${esc(p.code)}"></div>
      <div class="field" style="flex:1;min-width:220px"><label>Plan Title</label><input id="f_title" value="${esc(p.title)}"></div></div>
    <div class="row"><div class="field" style="flex:1"><label>Asset</label><select id="f_asset">${DB.assets.map(a=>`<option value="${a.id}" ${p.assetId===a.id?'selected':''}>${esc(a.code+' · '+a.name)}</option>`).join('')}</select></div>
      <div class="field" style="flex:1"><label>Frequency</label><select id="f_freq">${PM_FREQ.map(f=>`<option ${p.frequency===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div class="field" style="flex:1"><label>Technician</label><select id="f_tech"><option value="">— Unassigned —</option>${DB.techs.map(t=>`<option value="${t.id}" ${p.assigneeId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div>
    <div class="row"><div class="field" style="flex:1"><label>Last Done</label><input type="date" id="f_last" value="${esc(p.lastDone)}"></div>
      <div class="field" style="flex:1"><label>Next Due</label><input type="date" id="f_next" value="${esc(p.nextDue)}"></div>
      <div class="field" style="flex:1"><label>Est. Hours</label><input type="number" step="0.5" id="f_est" value="${p.estHours}"></div>
      <div class="field" style="flex:1"><label>Active</label><select id="f_active"><option value="true" ${p.active?'selected':''}>Yes</option><option value="false" ${!p.active?'selected':''}>Paused</option></select></div></div>
    <div class="field"><label>Checklist / Tasks</label><textarea id="f_tasks">${esc(p.tasks||'')}</textarea></div>
    <div style="margin-top:12px"><button class="btn" onclick="savePM('${id}')">Save</button> <button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
function savePM(id){
  const o={code:$('f_code').value.trim(),title:$('f_title').value.trim(),assetId:$('f_asset').value,frequency:$('f_freq').value,
    assigneeId:$('f_tech').value,lastDone:$('f_last').value,nextDue:$('f_next').value,estHours:+$('f_est').value||0,
    active:$('f_active').value==='true',tasks:$('f_tasks').value.trim()};
  if(!o.code||!o.title){toast('Code and title are required.');return;}
  if(id)Object.assign(DB.pmPlans.find(x=>x.id===id),o);else DB.pmPlans.push(Object.assign({id:uid('p')},o));
  save();closeModal();render();toast('PM plan saved.');
}
function delPM(id){if(!confirm('Delete this PM plan?'))return;DB.pmPlans=DB.pmPlans.filter(p=>p.id!==id);save();render();toast('PM plan deleted.');}
function genFromPM(id){
  const p=DB.pmPlans.find(x=>x.id===id);if(!p)return;
  const code='WO-'+String(DB.seq.wo++).padStart(4,'0');
  DB.workOrders.push({id:uid('w'),code:code,title:p.title,assetId:p.assetId,type:'Preventive',priority:'Medium',
    status:'Assigned',assigneeId:p.assigneeId,reportedBy:'PM Scheduler',description:p.tasks||'',createdDate:today(),
    dueDate:p.nextDue<=today()?p.nextDue:dstr(3),completedDate:'',estHours:p.estHours,actualHours:0,downtimeMins:0,partsCost:0,laborCost:0});
  p.lastDone=addFreq(p.lastDone,p.frequency);p.nextDue=addFreq(p.nextDue,p.frequency);
  save();render();toast('Work order '+code+' generated from '+p.code+'.');
}
function generateAllDue(){
  const due=DB.pmPlans.filter(p=>p.active&&p.nextDue<=today());
  if(!due.length){toast('No PM plans are due.');return;}
  due.forEach(p=>{const code='WO-'+String(DB.seq.wo++).padStart(4,'0');
    DB.workOrders.push({id:uid('w'),code:code,title:p.title,assetId:p.assetId,type:'Preventive',priority:'Medium',status:'Assigned',assigneeId:p.assigneeId,reportedBy:'PM Scheduler',description:p.tasks||'',createdDate:today(),dueDate:p.nextDue,completedDate:'',estHours:p.estHours,actualHours:0,downtimeMins:0,partsCost:0,laborCost:0});
    p.lastDone=addFreq(p.lastDone,p.frequency);p.nextDue=addFreq(p.nextDue,p.frequency);});
  save();render();toast(due.length+' work order(s) generated.');
}

/* ----------------------------- breakdowns ------------------------------- */
function breakdownsView(){
  const rows=DB.breakdowns.slice().sort((a,b)=>(b.startTs||0)-(a.startTs||0)).map(b=>`<tr>
    <td>${esc(asset(b.assetId).name)}</td>
    <td class="small">${new Date(b.startTs).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
    <td>${b.endTs?new Date(b.endTs).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):badge('Open','b-red')}</td>
    <td>${b.mins?badge((b.mins/60).toFixed(1)+' h','b-orange'):'—'}</td>
    <td>${esc(b.category||'—')}</td><td>${esc(b.cause)}</td><td class="small">${esc(b.action||'—')}</td>
    <td><button class="btn sm red" onclick="delBreakdown('${b.id}')">Del</button></td></tr>`).join('');
  const totalHrs=DB.breakdowns.reduce((s,b)=>s+(+b.mins||0),0)/60;
  return `<div class="grid g3" style="margin-bottom:16px">
      <div class="kpi"><div class="v">${DB.breakdowns.length}</div><div class="l">Breakdown Events</div></div>
      <div class="kpi"><div class="v">${totalHrs.toFixed(1)} h</div><div class="l">Total Downtime</div></div>
      <div class="kpi"><div class="v">${kpis().mttr.toFixed(1)} h</div><div class="l">MTTR</div></div></div>
    <div class="card"><div class="row" style="justify-content:space-between"><div><h2>Breakdown / Downtime Log</h2>
      <p class="desc">Failure history driving MTTR and availability.</p></div>
      <button class="btn" onclick="openBreakdownForm()">+ Log Breakdown</button></div>
    <table><thead><tr><th>Asset</th><th>Start</th><th>End</th><th>Duration</th><th>Category</th><th>Cause</th><th>Action</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="8" class="empty">No breakdowns logged.</td></tr>'}</tbody></table></div>`;
}
function openBreakdownForm(){
  modal(`<h2>Log Breakdown</h2>
    <div class="field"><label>Asset</label><select id="f_asset">${DB.assets.map(a=>`<option value="${a.id}">${esc(a.code+' · '+a.name)}</option>`).join('')}</select></div>
    <div class="row"><div class="field" style="flex:1"><label>Category</label><select id="f_cat">${TRADES.concat(['Lubrication','Operations']).map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="field" style="flex:1"><label>Duration (minutes)</label><input type="number" id="f_mins" value="60"></div></div>
    <div class="field"><label>Cause</label><input id="f_cause" placeholder="Root cause / symptom"></div>
    <div class="field"><label>Action Taken</label><input id="f_action" placeholder="Corrective action"></div>
    <div style="margin-top:12px"><button class="btn" onclick="saveBreakdown()">Save</button> <button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
function saveBreakdown(){
  const mins=+$('f_mins').value||0;const start=Date.now();
  DB.breakdowns.push({id:uid('b'),assetId:$('f_asset').value,startTs:start-mins*60000,endTs:start,mins:mins,
    cause:$('f_cause').value.trim()||'—',action:$('f_action').value.trim()||'—',category:$('f_cat').value,workOrderId:''});
  const a=DB.assets.find(x=>x.id===$('f_asset').value);if(a)a.status='Running';
  save();closeModal();render();toast('Breakdown logged.');
}
function delBreakdown(id){if(!confirm('Delete this breakdown record?'))return;DB.breakdowns=DB.breakdowns.filter(b=>b.id!==id);save();render();toast('Deleted.');}

/* ------------------------------- parts ---------------------------------- */
function partsView(){
  const rows=DB.parts.map(p=>{const low=p.stock<=p.minStock;
    return `<tr><td><b>${esc(p.code)}</b></td><td>${esc(p.name)}<div class="small muted">${esc(p.category)}</div></td>
      <td>${esc(p.location||'—')}</td>
      <td>${badge(p.stock+' '+esc(p.uom),low?'b-red':'b-green')}</td><td>${p.minStock}</td>
      <td>${money(p.unitCost)}</td><td>${money(p.stock*p.unitCost)}</td>
      <td><button class="btn sm ghost" onclick="adjPart('${p.id}',1)">+</button>
          <button class="btn sm ghost" onclick="adjPart('${p.id}',-1)">−</button>
          <button class="btn sm ghost" onclick="openPartForm('${p.id}')">Edit</button>
          <button class="btn sm red" onclick="delPart('${p.id}')">Del</button></td></tr>`;}).join('');
  const lowCount=DB.parts.filter(p=>p.stock<=p.minStock).length;
  const value=DB.parts.reduce((s,p)=>s+p.stock*p.unitCost,0);
  return `<div class="grid g3" style="margin-bottom:16px">
      <div class="kpi"><div class="v">${DB.parts.length}</div><div class="l">Part Numbers</div></div>
      <div class="kpi"><div class="v" style="color:${lowCount?'#C0392B':'#1E8449'}">${lowCount}</div><div class="l">Below Min Stock</div></div>
      <div class="kpi"><div class="v">${money(value)}</div><div class="l">Stock Value</div></div></div>
    <div class="card"><div class="row" style="justify-content:space-between"><div><h2>Spare Parts / Store</h2>
      <p class="desc">Inventory with re-order alerting and valuation.</p></div>
      <button class="btn" onclick="openPartForm('')">+ Add Part</button></div>
    <table><thead><tr><th>Code</th><th>Description</th><th>Location</th><th>On Hand</th><th>Min</th><th>Unit Cost</th><th>Value</th><th>Actions</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="8" class="empty">No parts.</td></tr>'}</tbody></table></div>`;
}
function openPartForm(id){
  const p=id?DB.parts.find(x=>x.id===id):{code:'SP-'+String(DB.seq.part).padStart(3,'0'),name:'',category:'Bearings',uom:'Nos',stock:0,minStock:1,unitCost:0,location:''};
  modal(`<h2>${id?'Edit':'Add'} Spare Part</h2>
    <div class="row"><div class="field" style="flex:0 0 130px"><label>Code</label><input id="f_code" value="${esc(p.code)}"></div>
      <div class="field" style="flex:1;min-width:220px"><label>Description</label><input id="f_name" value="${esc(p.name)}"></div></div>
    <div class="row"><div class="field" style="flex:1"><label>Category</label><input id="f_cat" value="${esc(p.category)}"></div>
      <div class="field" style="flex:1"><label>UoM</label><select id="f_uom">${['Nos','Litre','Kg','Metre','Set'].map(u=>`<option ${p.uom===u?'selected':''}>${u}</option>`).join('')}</select></div>
      <div class="field" style="flex:1"><label>Location</label><input id="f_loc" value="${esc(p.location)}"></div></div>
    <div class="row"><div class="field" style="flex:1"><label>Stock</label><input type="number" id="f_stock" value="${p.stock}"></div>
      <div class="field" style="flex:1"><label>Min Stock</label><input type="number" id="f_min" value="${p.minStock}"></div>
      <div class="field" style="flex:1"><label>Unit Cost</label><input type="number" id="f_cost" value="${p.unitCost}"></div></div>
    <div style="margin-top:12px"><button class="btn" onclick="savePart('${id}')">Save</button> <button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
function savePart(id){
  const o={code:$('f_code').value.trim(),name:$('f_name').value.trim(),category:$('f_cat').value.trim(),uom:$('f_uom').value,
    location:$('f_loc').value.trim(),stock:+$('f_stock').value||0,minStock:+$('f_min').value||0,unitCost:+$('f_cost').value||0};
  if(!o.code||!o.name){toast('Code and description are required.');return;}
  if(id)Object.assign(DB.parts.find(x=>x.id===id),o);else DB.parts.push(Object.assign({id:uid('s')},o));
  save();closeModal();render();toast('Part saved.');
}
function adjPart(id,d){const p=DB.parts.find(x=>x.id===id);p.stock=Math.max(0,p.stock+d);save();render();}
function delPart(id){if(!confirm('Delete this part?'))return;DB.parts=DB.parts.filter(p=>p.id!==id);save();render();toast('Part deleted.');}

/* ---------------------------- technicians ------------------------------- */
function techsView(){
  const rows=DB.techs.map(t=>{
    const wos=DB.workOrders.filter(w=>w.assigneeId===t.id);
    const open=wos.filter(isOpen).length;
    const pm=DB.pmPlans.filter(p=>p.assigneeId===t.id&&p.active).length;
    const hrs=wos.reduce((s,w)=>s+(+w.actualHours||0),0);
    return `<tr><td><b>${esc(t.code)}</b></td><td>${esc(t.name)}</td><td>${badge(t.trade,'b-blue')}</td>
      <td>${esc(t.shift)}</td><td class="small">${esc(t.phone||'—')}</td><td>${open} / ${wos.length}</td><td>${pm}</td><td>${hrs.toFixed(1)} h</td>
      <td><button class="btn sm ghost" onclick="openTechForm('${t.id}')">Edit</button>
          <button class="btn sm red" onclick="delTech('${t.id}')">Del</button></td></tr>`;}).join('');
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Technicians & Workload</h2>
      <p class="desc">Maintenance workforce and their current assignment load.</p></div>
      <button class="btn" onclick="openTechForm('')">+ Add Technician</button></div>
    <table><thead><tr><th>Code</th><th>Name</th><th>Trade</th><th>Shift</th><th>Phone</th><th>Open/Total WO</th><th>PM Plans</th><th>Hours</th><th>Actions</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="9" class="empty">No technicians.</td></tr>'}</tbody></table></div>`;
}
function openTechForm(id){
  const t=id?DB.techs.find(x=>x.id===id):{code:'TEC-'+String(DB.seq.tech).padStart(3,'0'),name:'',trade:'Mechanical',shift:'General',phone:'',active:true};
  modal(`<h2>${id?'Edit':'Add'} Technician</h2>
    <div class="row"><div class="field" style="flex:0 0 130px"><label>Code</label><input id="f_code" value="${esc(t.code)}"></div>
      <div class="field" style="flex:1"><label>Name</label><input id="f_name" value="${esc(t.name)}"></div></div>
    <div class="row"><div class="field" style="flex:1"><label>Trade</label><select id="f_trade">${TRADES.map(x=>`<option ${t.trade===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field" style="flex:1"><label>Shift</label><select id="f_shift">${SHIFTS.map(x=>`<option ${t.shift===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field" style="flex:1"><label>Phone</label><input id="f_phone" value="${esc(t.phone||'')}"></div></div>
    <div style="margin-top:12px"><button class="btn" onclick="saveTech('${id}')">Save</button> <button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
function saveTech(id){
  const o={code:$('f_code').value.trim(),name:$('f_name').value.trim(),trade:$('f_trade').value,shift:$('f_shift').value,phone:$('f_phone').value.trim(),active:true};
  if(!o.code||!o.name){toast('Code and name are required.');return;}
  if(id)Object.assign(DB.techs.find(x=>x.id===id),o);else DB.techs.push(Object.assign({id:uid('t')},o));
  save();closeModal();render();toast('Technician saved.');
}
function delTech(id){if(!confirm('Delete this technician? Their work orders become unassigned.'))return;DB.techs=DB.techs.filter(t=>t.id!==id);DB.workOrders.forEach(w=>{if(w.assigneeId===id)w.assigneeId='';});save();render();toast('Technician deleted.');}

/* ------------------------------- reports -------------------------------- */
function reportsView(){
  const k=kpis();
  const byType=WO_TYPES.map(t=>({label:t,value:DB.workOrders.filter(w=>w.type===t).length,color:'#2E86C1'})).filter(r=>r.value);
  const byTech=DB.techs.map(t=>{const wos=DB.workOrders.filter(w=>w.assigneeId===t.id);
    return {label:t.name,value:wos.filter(w=>w.status==='Completed'||w.status==='Closed').length,color:'#1E8449'};}).filter(r=>r.value).sort((a,b)=>b.value-a.value);
  const costByAsset={};
  DB.workOrders.forEach(w=>{costByAsset[w.assetId]=(costByAsset[w.assetId]||0)+(+w.partsCost||0)+(+w.laborCost||0);});
  const costRows=Object.keys(costByAsset).map(id=>({label:asset(id).name,value:Math.round(costByAsset[id]),color:'#E67E22'})).sort((a,b)=>b.value-a.value).slice(0,8);
  const dtByAsset={};
  DB.breakdowns.forEach(b=>{dtByAsset[b.assetId]=(dtByAsset[b.assetId]||0)+(+b.mins||0);});
  const dtRows=Object.keys(dtByAsset).map(id=>({label:asset(id).name,value:Math.round(dtByAsset[id]/60*10)/10,color:'#C0392B'})).sort((a,b)=>b.value-a.value).slice(0,8);
  const periodHrs=periodDays()*DB.settings.plantHoursPerDay;
  return `
  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi"><div class="v">${k.avail.toFixed(1)}%</div><div class="l">Availability</div><div class="s">target ≥ 95%</div></div>
    <div class="kpi"><div class="v">${k.mttr.toFixed(1)} h</div><div class="l">MTTR</div><div class="s">mean time to repair</div></div>
    <div class="kpi"><div class="v">${k.mtbf.toFixed(0)} h</div><div class="l">MTBF</div><div class="s">mean time between failures</div></div>
    <div class="kpi"><div class="v" style="color:${k.pmCompliance>=90?'#1E8449':'#E67E22'}">${k.pmCompliance}%</div><div class="l">PM Compliance</div></div>
  </div>
  <div class="card"><h2>Maintenance KPIs</h2><p class="desc">Computed from the last ${periodDays()} days of work orders and breakdown events.</p>
    <table><thead><tr><th>Indicator</th><th>Value</th><th>Basis</th></tr></thead><tbody>
      <tr><td>Availability</td><td><b>${k.avail.toFixed(2)}%</b></td><td class="small">(${periodHrs} h − downtime) ÷ ${periodHrs} h</td></tr>
      <tr><td>MTTR</td><td><b>${k.mttr.toFixed(2)} h</b></td><td class="small">total breakdown minutes ÷ failures (${DB.breakdowns.length})</td></tr>
      <tr><td>MTBF</td><td><b>${k.mtbf.toFixed(1)} h</b></td><td class="small">operating hours ÷ failures</td></tr>
      <tr><td>PM Compliance</td><td><b>${k.pmCompliance}%</b></td><td class="small">completed PM work orders ÷ total PM work orders</td></tr>
      <tr><td>Open Work Orders</td><td><b>${k.open}</b></td><td class="small">${k.overdue} overdue</td></tr>
      <tr><td>Maintenance Cost</td><td><b>${money(k.cost)}</b></td><td class="small">parts + labour across all work orders</td></tr>
      <tr><td>Assets down</td><td><b>${k.down}</b></td><td class="small">of ${k.assets} registered assets</td></tr>
    </tbody></table></div>
  <div class="grid g2">
    <div class="card"><h2>Work Orders by Type</h2>${barChart(byType)}</div>
    <div class="card"><h2>Completed by Technician</h2>${barChart(byTech)}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Downtime by Asset (hours)</h2>${barChart(dtRows)}</div>
    <div class="card"><h2>Maintenance Cost by Asset</h2>${barChart(costRows)}</div>
  </div>`;
}

/* ------------------------------- modal ---------------------------------- */
function modal(html){$('modal').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){$('modal').innerHTML='';}

/* ------------------------------- init ----------------------------------- */
load();
render();
</script>
</body>
</html>
